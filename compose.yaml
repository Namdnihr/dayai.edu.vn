services:
  backend:
    build:
      context: ./docker/php
    container_name: dayai-backend
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      LOG_LEVEL: warning
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: dayai
      DB_USERNAME: dayai_user
      DB_PASSWORD: dayai_pass
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - dayai

  queue:
    build:
      context: ./docker/php
    container_name: dayai-queue
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      LOG_LEVEL: warning
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: dayai
      DB_USERNAME: dayai_user
      DB_PASSWORD: dayai_pass
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - dayai

  nginx:
    image: nginx:1.27-alpine
    container_name: dayai-nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - dayai

  postgres:
    image: postgres:17-alpine
    container_name: dayai-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: dayai
      POSTGRES_USER: dayai_user
      POSTGRES_PASSWORD: dayai_pass
    volumes:
      - dayai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayai_user -d dayai"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - dayai

  redis:
    image: redis:8-alpine
    container_name: dayai-redis
    ports:
      - "6379:6379"
    volumes:
      - dayai-redis:/data
    networks:
      - dayai

networks:
  dayai:
    driver: bridge

volumes:
  dayai-postgres:
  dayai-redis:
